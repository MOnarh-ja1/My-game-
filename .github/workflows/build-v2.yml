name: Build RUNIVERSE v2 — Godot Windows EXE
on:
  push:
    branches: [runiverse-v2]
    paths:
      - 'RuniverseV2/**'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 official editor
        run: |
          curl --fail --location --retry 3 --output godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Download official export template
        run: |
          curl --fail --location --retry 3 --output templates.tpz 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p templates.tpz templates/windows_release_x86_64.exe > "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"
      - name: Validate actual Godot scripts and project
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path RuniverseV2 --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log; then exit 1; fi
      - name: Runtime smoke test
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path RuniverseV2 --quit-after 40 2>&1 | tee start.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' start.log; then exit 1; fi
      - name: Export Windows 64-bit game
        run: |
          mkdir -p RuniverseV2/build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path RuniverseV2 --export-release 'Windows Desktop' build/RUNIVERSE.exe
          test -s RuniverseV2/build/RUNIVERSE.exe
          file RuniverseV2/build/RUNIVERSE.exe
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUNIVERSE-v2-Godot-Windows-x64
          path: RuniverseV2/build/RUNIVERSE.exe
          retention-days: 30
      - name: Create release with direct EXE download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create runiverse-v2.0 RuniverseV2/build/RUNIVERSE.exe \
            --title 'RUNIVERSE v2.0 — Windows EXE • MgameIO' \
            --notes 'Official Godot 4.7.2 export. 50 heroes, abilities, premium shop UI, 5 worlds, animated 3D runner.' \
            --target "$GITHUB_SHA" --latest=false
