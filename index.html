(()=>{
'use strict';
const el=id=>document.getElementById(id),root=el('game'),ui={cash:el('cash'),bag:el('bag'),quest:el('quest'),hint:el('hint'),action:el('action'),toast:el('toast'),modal:el('modalBackdrop'),title:el('modalTitle'),body:el('modalBody')};

let modalMode='';function open(type){modalMode=type;ui.modal.classList.add('show');joyReset();if(type==='safe')renderSafe();if(type==='seller')renderSeller();if(type==='shop')renderShop();if(type==='help')renderHelp()}

function renderSafe(){ui.title.textContent='🔐 Сейф';ui.body.innerHTML=`<p class="muted">Содержимое меняется каждые 4 секунды. Нажимай на предмет, чтобы забрать его в рюкзак.</p><div class="stats"><span>🎒 Место: ${state.bag.length}/${state.capacity}</span><span>⏳ Обновление: <span id="restock">4.0</span> сек</span></div><div class="items">${state.loot.length?state.loot.map((x,i)=>`<button class="item" data-take="${i}"><span class="emoji">${x.emoji}</span><strong>${x.name}</strong><small>${money(x.price)} ₽</small><span class="badge">ВЗЯТЬ</span></button>`).join(''):'<div class="muted">Сейф пуст. Скоро обновится!</div>'}</div><button class="mainbtn secondary" data-close="1">Закрыть сейф</button>`;ui.body.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const i=+b.dataset.take;if(!state.loot[i])return;if(state.bag.length>=state.capacity){toast('🎒 Рюкзак заполнен! Продай предметы.');return}const x=state.loot.splice(i,1)[0];state.bag.push(x);state.opened++;toast('+'+x.emoji+' '+x.name);update();renderSafe()});ui.body.querySelector('[data-close]').onclick=close}
function renderSeller(){const total=state.bag.reduce((s,x)=>s+x.price,0)*state.bonus;ui.title.textContent='🧑‍💼 Скупщик Макс';ui.body.innerHTML=`<p class="muted">«Привет! Принёс что-нибудь интересное? Я покупаю всё сразу и плачу честно.»</p><div class="items">${state.bag.length?state.bag.map(x=>`<div class="item"><span class="emoji">${x.emoji}</span><strong>${x.name}</strong><small>${money(x.price*state.bonus)} ₽</small></div>`).join(''):'<div class="muted">Рюкзак пуст. Забери предметы из сейфа.</div>'}</div><div class="stats"><span>Всего: ${state.bag.length} шт.</span><b style="color:#ffdb7e">${money(total)} ₽</b></div><button class="mainbtn" id="sell" ${!state.bag.length?'disabled':''}>💰 ПРОДАТЬ ВСЁ</button><button class="mainbtn secondary" id="sellerclose">Вернуться к игре</button>`;el('sell').onclick=()=>{state.cash+=total;state.sold+=state.bag.length;state.bag=[];toast('Продано на '+money(total)+' ₽!');update();renderSeller()};el('sellerclose').onclick=close}
const upgrades=[{key:'capacity',name:'🎒 Большой рюкзак',desc:'+2 места для добычи',max:13,step:2,base:300},{key:'speed',name:'👟 Быстрые кроссовки',desc:'Быстрее передвижение',max:6.5,step:.75,base:400},{key:'bonus',name:'💸 Выгодные сделки',desc:'+20% к цене продажи',max:2,step:.2,base:550}];
function renderShop(){ui.title.textContent='🛒 Магазин улучшений';ui.body.innerHTML=`<p class="muted">Зарабатывай на добыче и улучшай своего персонажа!</p>${upgrades.map((u,i)=>{const lv=Math.round((state[u.key]-(u.key==='capacity'?5:u.key==='speed'?3.5:1))/u.step);const cost=u.base*(lv+1);const maxed=state[u.key]>=u.max-0.01;return `<div class="shoprow"><div><b>${u.name}</b><small>${u.desc} · уровень ${lv}${maxed?' (макс.)':''}</small></div><button class="buy" data-buy="${i}" ${maxed||state.cash<cost?'disabled':''}>${maxed?'ГОТОВО':money(cost)+' ₽'}</button></div>`}).join('')}<button class="mainbtn secondary" id="shopclose">Закрыть</button>`;ui.body.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const u=upgrades[+b.dataset.buy],lv=Math.round((state[u.key]-(u.key==='capacity'?5:u.key==='speed'?3.5:1))/u.step),cost=u.base*(lv+1);if(state.cash<cost||state[u.key]>=u.max-.01)return;state.cash-=cost;state[u.key]=Math.min(u.max,+(state[u.key]+u.step).toFixed(3));toast('✨ Улучшение куплено!');update();renderShop()});el('shopclose').onclick=close}
function renderHelp(){ui.title.textContent='🎮 SAFE RUN';ui.body.innerHTML=`<div class="help"><b>Твоя цель:</b> Забирай предметы из сейфа, продавай их скупщику Максу, улучшай рюкзак и скорость, выполняй задания.<br><br><b>Управление:</b> Левая половина — свободный джойстик. Правая половина — поворот камеры пальцем. Персонаж идёт в направлении джойстика относительно камеры. Фиолетовая кнопка — взаимодействовать.<br><br><b>Секрет:</b> Возле большого дерева спрятан бонусный сундук. Он восстанавливается каждые 25 секунд.</div><button class="mainbtn" id="claim">🎁 Забрать награду за задание</button><button class="mainbtn secondary" id="helpexit">Играть</button>`;el('claim').onclick=()=>{if(!award())toast('Пока задание не выполнено');renderHelp()};el('helpexit').onclick=close}

[[ -7,-7,1.1],[-11,4,.85],[-5,8,1.2],[10,-8,1.1],[12,7,1.2],[-13,-12,1.4],[5,12,.9]].forEach(a=>tree(...a));for(let i=0;i<35;i++){const x=(Math.random()-.5)*37,z=(Math.random()-.5)*35;if(Math.abs(x)<4&&z>-7&&z<8||Math.abs(x-6)<3&&Math.abs(z-2)<4)continue;let o=box(.4+Math.random()*.6,.3+Math.random()*.4,.4+Math.random()*.6,M.stone,scene,x,.2,z);o.rotation.y=Math.random()*3}

function marker(text,at,color){const c=document.createElement('canvas');c.width=256;c.height=64;let k=c.getContext('2d');k.fillStyle='#111827c9';k.beginPath();k.roundRect(4,4,248,56,19);k.fill();k.fillStyle=color;k.textAlign='center';k.font='bold 30px system-ui';k.fillText(text,128,43);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.position.set(...at);s.scale.set(2.7,.67,1);scene.add(s);return s}
marker('🔐 СЕЙФ',[0,3.65,-3.6],'#f0d89a');marker('💰 ПРОДАЖА',[6,3.5,2],'#a7f5de');marker('🎁 БОНУС',[-7.8,1.8,-6.1],'#ffe59c');
// input: free joystick wherever in left screen; camera ONLY right zone
const joyArea=el('joyArea'),joyBase=el('joyBase'),joyKnob=el('joyKnob');let joyId=null,joyAnchor={x:0,y:0},joy={x:0,y:0},camId=null,camPrev={x:0,y:0},yaw=0,pitch=.32;const R=45;
function joyReset(){joyId=null;joy.x=joy.y=0;joyKnob.style.transform='translate(-50%,-50%)';joyBase.style.left='calc(max(24px,env(safe-area-inset-left)) + 38px)';joyBase.style.bottom='calc(57px + env(safe-area-inset-bottom))';joyBase.style.top='auto'}
joyArea.addEventListener('pointerdown',e=>{if(modalMode||joyId!==null)return;joyId=e.pointerId;joyAnchor={x:e.clientX,y:e.clientY};joyBase.style.left=e.clientX+'px';joyBase.style.top=(e.clientY-58)+'px';joyBase.style.bottom='auto';joyArea.setPointerCapture(e.pointerId);moveJoy(e)});function moveJoy(e){if(e.pointerId!==joyId)return;let dx=e.clientX-joyAnchor.x,dy=e.clientY-joyAnchor.y,len=Math.hypot(dx,dy);if(len>R){dx*=R/len;dy*=R/len}joy.x=dx/R;joy.y=dy/R;joyKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}joyArea.addEventListener('pointermove',moveJoy);joyArea.addEventListener('pointerup',e=>{if(e.pointerId===joyId)joyReset()});joyArea.addEventListener('pointercancel',e=>{if(e.pointerId===joyId)joyReset()});
renderer.domElement.addEventListener('pointerdown',e=>{if(modalMode||e.clientX<innerWidth*.48||camId!==null)return;camId=e.pointerId;camPrev={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==camId||modalMode)return;const dx=e.clientX-camPrev.x,dy=e.clientY-camPrev.y;yaw+=dx*.006;pitch=Math.max(-.04,Math.min(.83,pitch+dy*.004));camPrev={x:e.clientX,y:e.clientY}});function camEnd(e){if(e.pointerId===camId)camId=null}renderer.domElement.addEventListener('pointerup',camEnd);renderer.domElement.addEventListener('pointercancel',camEnd);

let nearby='',distance=0;function findNear(){const p=actor.g.position,ds=Math.hypot(p.x,p.z+3.6),dn=Math.hypot(p.x-6,p.z-1),dc=Math.hypot(p.x+7.8,p.z+6.1);let arr=[['safe',ds,2.6],['seller',dn,2.8],['chest',dc,2.2]];arr.sort((a,b)=>a[1]-b[1]);const [id,d,reach]=arr[0];nearby=d<reach?id:'';distance=d;ui.action.disabled=!nearby;ui.hint.innerHTML=nearby==='safe'?'🔐 Открыть сейф<span>Забирай добычу каждые 4 секунды</span>':nearby==='seller'?'💰 Продать добычу<span>Макс купит содержимое рюкзака</span>':nearby==='chest'?'🎁 Найти бонус<span>Секретный сундук</span>':'Иди к сейфу или скупщику<span>Левый палец — ходьба · Правый — камера</span>';ui.action.querySelector('span').textContent=nearby==='safe'?'🔐':nearby==='seller'?'💰':nearby==='chest'?'🎁':'✋'}
function interact(){if(modalMode)return;findNear();if(nearby==='safe'){open('safe')}else if(nearby==='seller')open('seller');else if(nearby==='chest'){if(Date.now()<chestNext){toast('Сундук пуст. Загляни позже!')}else{const amount=100+Math.floor(Math.random()*201);state.cash+=amount;chestNext=Date.now()+25000;toast('🎁 Секретный бонус: +'+amount+' ₽');update()}}else toast('Подойди ближе к объекту')}
ui.action.onclick=interact;
// loop
let last=performance.now(),step=0,uiTick=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(modalMode==='safe'){const l=el('restock');if(l)l.textContent=(Math.max(0,state.nextRestock-Date.now())/1000).toFixed(1)}if(Date.now()>=state.nextRestock)restock();const moveX=modalMode?0:Math.max(-1,Math.min(1,joy.x+(pressed.d||pressed.arrowright?1:0)-(pressed.a||pressed.arrowleft?1:0)));const moveY=modalMode?0:Math.max(-1,Math.min(1,joy.y+(pressed.s||pressed.arrowdown?1:0)-(pressed.w||pressed.arrowup?1:0)));const mag=Math.min(1,Math.hypot(moveX,moveY));if(mag>.08){const mx=moveX*Math.cos(yaw)+moveY*Math.sin(yaw),mz=-moveX*Math.sin(yaw)+moveY*Math.cos(yaw);actor.g.position.x+=mx*state.speed*dt;actor.g.position.z+=mz*state.speed*dt;actor.g.position.x=Math.max(-21,Math.min(21,actor.g.position.x));actor.g.position.z=Math.max(-21,Math.min(21,actor.g.position.z));const facing=Math.atan2(-mx,-mz);let delta=(facing-actor.g.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI;actor.g.rotation.y+=delta*Math.min(1,dt*11);step+=dt*state.speed*3;actor.la.rotation.x=Math.sin(step*3)*.35*mag;actor.ra.rotation.x=-Math.sin(step*3)*.35*mag;actor.g.children.forEach(()=>{});actor.g.position.y=Math.abs(Math.sin(step*3))*.045}else{actor.g.position.y*=.88;actor.la.rotation.x*=.86;actor.ra.rotation.x*=.86}
const target=actor.g.position.clone().add(new THREE.Vector3(0,1.45,0));const arm=4.9;const desired=target.clone().add(new THREE.Vector3(Math.sin(yaw)*arm*Math.cos(pitch),1.1+arm*Math.sin(pitch),Math.cos(yaw)*arm*Math.cos(pitch)));camera.position.lerp(desired,Math.min(1,dt*10));camera.lookAt(target);if(now-uiTick>125){findNear();uiTick=now}renderer.render(scene,camera)}
